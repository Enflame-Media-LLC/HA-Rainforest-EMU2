[project]
name = "ha-rainforest-emu2"
version = "0.1.0"
description = "Home Assistant integration for Rainforest EMU-2 and RAVEn devices"
requires-python = ">=3.14.2"
dependencies = ["aioraven==0.7.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]
exclude = ["tests*", "brand*"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-homeassistant-custom-component",
  "aiousbwatcher==1.1.2",
  "serialx==1.10.0",
  "voluptuous-serialize>=2.7.0",
]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "ruff>=0.9",
  "aiousbwatcher==1.1.2",
  "serialx==1.10.0",
  "types-pyserial",
  "voluptuous-serialize>=2.7.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
