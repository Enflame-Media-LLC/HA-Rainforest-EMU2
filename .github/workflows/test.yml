name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
        home_assistant: ["2026.3.1", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.home_assistant }}" = "stable" ]; then
            HA_SPEC=homeassistant
            TEST_HELPER_SPEC=pytest-homeassistant-custom-component
          else
            HA_SPEC="homeassistant==${{ matrix.home_assistant }}"
            TEST_HELPER_SPEC=pytest-homeassistant-custom-component==0.13.317
          fi
          python -m pip install "$HA_SPEC" "$TEST_HELPER_SPEC" -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
