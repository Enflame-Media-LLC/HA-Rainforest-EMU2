name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/rainforest_emu2/manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant==2026.3.1" pytest pytest-homeassistant-custom-component==0.13.317
          python -m pytest -q
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
