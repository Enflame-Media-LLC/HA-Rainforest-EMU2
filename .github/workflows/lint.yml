name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install ruff mypy homeassistant==2026.3.0 -e "."
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Mypy
        run: mypy custom_components/rainforest_emu2
