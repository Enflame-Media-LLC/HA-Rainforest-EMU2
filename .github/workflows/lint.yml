name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install tools
        run: python -m pip install ruff mypy homeassistant==2026.3.1 -e ".[dev]"
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Mypy
        run: mypy custom_components/rainforest_emu2
